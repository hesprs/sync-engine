name: Release SDK

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  release-sdk:
    runs-on: ubuntu-slim

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Symlink Node to Bun
        run: |
          mkdir -p "$RUNNER_TEMP/bun-node-bin"
          ln -s "$(command -v bun)" "$RUNNER_TEMP/bun-node-bin/node"
          echo "$RUNNER_TEMP/bun-node-bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install

      - name: Publish to npm
        run: cd packages/plugin && bunx npm@latest publish
